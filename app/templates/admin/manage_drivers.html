{% extends "base.html" %}

{% block title %}Manage Drivers - MapMyWaste{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Manage Drivers</h3>
    <div class="card mb-4">
        <div class="card-body">
            <form method="POST">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input name="name" class="form-control" placeholder="Driver Name" required>
                    </div>
                    <div class="col-md-3">
                        <input name="license_number" class="form-control" placeholder="License Number">
                    </div>
                    <div class="col-md-3">
                        <input name="phone" class="form-control" placeholder="Phone">
                    </div>
                    <div class="col-md-2">
                        <input name="email" type="email" class="form-control" placeholder="Email">
                    </div>
                </div>
                <div class="mt-2">
                    <button class="btn btn-primary">Add Driver</button>
                    <a href="{{ url_for('admin.truck_assignments') }}" class="btn btn-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5>Drivers</h5>
            <div class="list-group">
                {% for d in drivers %}
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ d.name }}</strong><br>
                        <small class="text-muted">{{ d.license_number }} • {{ d.phone }}</small>
                    </div>
                    <div>
                        <span class="badge bg-{{ 'success' if d.status=='available' else 'secondary' }}">{{ d.status or 'Unknown' }}</span>
                    </div>
                </div>
                {% else %}
                <div class="text-muted p-3">No drivers yet.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
