{% extends "base.html" %}

{% block title %}Optimize Routes - MapMyWaste{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Optimize Routes</h3>
    <div class="card mb-4">
        <div class="card-body">
            <form method="POST" class="row g-2 align-items-center">
                <div class="col-auto">
                    <label class="form-label">Clusters (k)</label>
                    <input type="number" name="k" class="form-control" value="5">
                </div>
                <div class="col-auto mt-4">
                    <button class="btn btn-success">Run Optimization</button>
                    <a href="{{ url_for('admin.truck_assignments') }}" class="btn btn-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5>Map</h5>
            <div id="opt-map" style="height:400px"></div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('opt-map').setView([{{ depot_lat }}, {{ depot_lon }}], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
{% for r in reports %}
L.marker([{{ r.latitude }}, {{ r.longitude }}]).addTo(map).bindPopup('Report #{{ r.id }}');
{% endfor %}
</script>
{% endblock %}
